name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Record deployment approval context
        run: |
          echo "Deployment approval gate passed for environment: github-pages"
          echo "Workflow trigger actor: @${{ github.actor }}"
          echo "Current triggering actor: @${{ github.triggering_actor }}"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Environment approval reviewer is recorded by GitHub in the Deployment/Environment details."
          {
            echo "## Deployment approval gate passed"
            echo ""
            echo "- Environment: \`github-pages\`"
            echo "- Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Workflow trigger actor: @${{ github.actor }}"
            echo "- Current triggering actor: @${{ github.triggering_actor }}"
            echo "- Environment approval reviewer: recorded by GitHub in the Deployment/Environment details"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'      # Upload toàn bộ folder root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
